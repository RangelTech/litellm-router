# Config minima do LiteLLM -- deployments/Teams/keys vem do banco (STORE_MODEL_IN_DB=True).
# Aqui: provider customizado do Codex + guard de isolamento entre tenants.
litellm_settings:
  custom_provider_map:
    - provider: "codex-direct"
      custom_handler: custom_provider.codex_custom_llm
  callbacks: isolation_guard.isolation_guard
