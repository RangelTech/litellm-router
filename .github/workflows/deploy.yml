name: Deploy LiteLLM Router

# correcao-01-execucao-completa.md secao 3a -- litellm-router deixa de usar
# a imagem oficial pura (ghcr.io/berriai/litellm) e passa a buildar imagem
# propria (Dockerfile deste repo) que registra o provider customizado do
# Codex (custom_provider.py, litellm.custom_provider_map). Mesmo padrao de
# workflow ja usado no agent-platform pro oauth-browser.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: litellm-router-cloudrun-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/234554472049/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deployer@rangel-tech.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build image
        run: gcloud builds submit --project=rangel-tech --config=infra/cloudbuild-litellm-router.yaml --substitutions=SHORT_SHA=${{ github.sha }} .
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.0" }
      - name: Apply
        working-directory: terraform
        env:
          TF_VAR_litellm_image: us-central1-docker.pkg.dev/rangel-tech/containers/litellm-router:${{ github.sha }}
        run: |
          terraform init -input=false
          terraform import -input=false -lock=false google_cloud_run_v2_service.litellm projects/rangel-tech/locations/us-central1/services/litellm-router || true
          terraform import -input=false -lock=false google_cloud_run_v2_service_iam_member.invoker "projects/rangel-tech/locations/us-central1/services/litellm-router roles/run.invoker allUsers" || true
          for secret in litellm-database-url litellm-redis-url litellm-master-key; do
            terraform import -input=false -lock=false "google_secret_manager_secret_iam_member.litellm_runtime_secrets[\"$secret\"]" "projects/rangel-tech/secrets/$secret roles/secretmanager.secretAccessor serviceAccount:234554472049-compute@developer.gserviceaccount.com" || true
          done
          terraform apply -input=false -lock=false -auto-approve
      - name: Smoke check
        run: curl -fsS --retry 5 --retry-all-errors "$(gcloud run services describe litellm-router --project=rangel-tech --region=us-central1 --format='value(status.url)')/health/liveliness" | grep -q '"status":"healthy"'
